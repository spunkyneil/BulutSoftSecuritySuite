  function updateAndDrawArcs(isDark, cx, cy) {
    const mode = MODES[effKey()];

    if (state.demoYay) for (let n = 0; n < (state.zoom > 1.15 ? 2 : 1); n++) if (arcs.length < mode.maxArcs && Math.random() < mode.spawnChance) spawnArc();

  /* ANİMASYON DENETİMİ: görünmezken (sekme gizli, pencere küçültüldü, panel gizlendi) requestAnimationFrame döngüsü TAMAMEN durur (CPU/GPU kullanımı sıfır); görününce kalınan yerden sürer.

  state.kare = 0; state.hostDurdu = false; state.tabanCizim = 0; state.tabanBasim = 0;
  let lastTs = performance.now(), rafId = 0, sonCizim = 0, minKareMs = 0, maliyetEma = 8, yavasKare = 0, hizliKare = 0, cokYavas = 0;
