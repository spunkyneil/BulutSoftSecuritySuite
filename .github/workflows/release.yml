name: release
# Sürüm etiketi (örn. v1.6.0) atılınca kurulum paketlerini derler, (SignPath ayarlıysa) imzalar
# ve GitHub'da TASLAK (draft) bir Release oluşturur. Taslağı siz inceleyip yayınlarsınız.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paketle:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Sürümü oku ve etiketle karşılaştır
        id: surum
        shell: pwsh
        run: |
          $m = Select-String -Path Directory.Build.props -Pattern '<Version>\s*([0-9]+(\.[0-9]+){1,3})\s*</Version>' | Select-Object -First 1
          $s = $m.Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$s") { throw "Etiket ($env:GITHUB_REF_NAME) ile Directory.Build.props sürümü (v$s) uyuşmuyor." }
          "surum=$s" >> $env:GITHUB_OUTPUT

      - name: Kaynak-kuralı testleri
        run: dotnet test LabDenetim.Tests -c Release --filter "Tur=KaynakKurali" --blame-hang-timeout 5m

      - name: Inno Setup 6 hazırla
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          "${env:ProgramFiles(x86)}\Inno Setup 6" >> $env:GITHUB_PATH

      - name: WebView2 çevrimdışı kurucusunu indir (Microsoft imzası Yayinla.ps1 içinde doğrulanır)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force Kurucular | Out-Null
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/?linkid=2124701' -OutFile 'Kurucular\MicrosoftEdgeWebView2RuntimeInstallerX64.exe'

      - name: Paketleri üret (Hafif + Çevrimdışı)
        shell: pwsh
        run: .\Yayinla.ps1 -TestleriAtla

      - name: İmzasız paketleri yükle
        id: imzasiz
        uses: actions/upload-artifact@v4
        with:
          name: paketler-imzasiz
          path: Output/*.exe

      # SignPath onayı gelince şu depo ayarlarını ekleyin:
      #   Variables: SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_POLICY_SLUG
      #   Secret:    SIGNPATH_API_TOKEN
      # Ayarlar yoksa bu adım atlanır ve paketler imzasız kalır.
      - name: SignPath ile imzala
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.imzasiz.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: imzali

      - name: İmzalı dosyaları yerine koy ve özetleri yenile
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: |
          Copy-Item imzali\*.exe Output\ -Force
          $s = Get-ChildItem Output\BulutSoft_Setup_v*.exe | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" }
          [IO.File]::WriteAllText("$PWD\Output\SHA256SUMS.txt", (($s -join "`n") + "`n"), (New-Object Text.UTF8Encoding $false))

      - name: Taslak Release oluştur
        if: ${{ github.ref_type == 'tag' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME --draft --title "BulutSoft Security Suite ${{ steps.surum.outputs.surum }}" --notes "Kurulum paketleri ve SHA-256 özetleri aşağıdadır. Değişiklikler için DEGISIKLIKLER.md dosyasına bakın." Output\BulutSoft_Setup_v${{ steps.surum.outputs.surum }}_Hafif.exe Output\BulutSoft_Setup_v${{ steps.surum.outputs.surum }}_Cevrimdisi.exe Output\SHA256SUMS.txt
